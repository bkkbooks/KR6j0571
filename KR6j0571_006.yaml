益能至如來根本之處此陀羅尼法本當入其手轉已復轉世尊彼等衆生最為極勝譬如世間亂系團轉未遍之頃若於彼時愛樂是經於衆生中而作廣説如是修多羅世尊彼人成就幾所善根作是語已佛告長老阿難言阿難若能於是修多羅中作廣説者彼人攝取無量善根阿難如四大藏中所有珍寶於初日分悉能布施若有比丘比丘尼優婆塞優婆夷以此陀羅尼法本為一衆生説意欲念持安置建立於彼善根此倍多於彼若為一衆生建立安置阿難我少分説喻若我具説廣生善根更多無量阿僧祇作是語已長老阿難白佛言世尊若有攝受此法本彼人生幾所善根佛告阿難我今為汝更作譬喻證明此義施者受者故阿難如恆河中所有沙還有如許恆河彼諸恆河沙等有若干寶藏阿難彼諸寶藏於一日初分時皆悉布施日中分時日後分時皆悉布施若有為一衆生授此陀羅尼法本以此善根倍多於彼阿難猶是如來少分説喻阿難如是次第百千俱致劫數如是布施者阿難我猶為説彼無有多福聚不如受此陀羅尼法本受已為一切衆生建立安置何以故阿難不聞如是法故無量阿僧祇劫數欲作無智發無智業阿難若有正語者言般若種子般若根本最勝般若當欲令熾盛因緣法故阿難此陀羅尼是正説者言阿難汝應受此陀羅尼法本向他建立作是語已長老阿難白佛言世尊如來為我作親近者世尊我等當受此陀羅尼法本復為他人建立安置

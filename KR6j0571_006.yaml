body:
  text: 隋北印度三藏闍那崛多譯爾時彼衆中波斯匿高薩羅王有一算師大臣名曰財主而來會坐即從坐起整理衣服偏袒右肩右膝著地合掌向佛而白佛言世尊我以一錢為初入於百千算數於彼一錢次第解入百千算數已從彼一錢破作半已解入俱致百千算數然世尊我有如是微細智慧寧復説言無有智也作是語已佛告財主大臣算師言汝若取芥子破為百千俱致分算數分已於彼百千俱致分復作百千俱致分入算數之分汝時於彼如是智慧應當無智作如是語已其波斯匿高薩羅王白佛言希有世尊我等所於彼有智中生羡樂相如來今者説為無智作如是語已佛告波斯匿高薩羅王言大王諸佛如來不讚此智所謂有漏諸佛如來讚歎無漏智所謂滅諸有智一智當言無智何者是一世間語言執著何者名世間語言執著世間語言名字等智若有執著彼諸名字便生瞋恚是名世間執著名字是為一智名無智者乃至彼智彼一切有為若有為者是即無實如是有為語言無實亦無名字亦悉無實以何義故名字無實此名欺誑以是義故此名無實以無實智當向惡趣以是義故此名無實所言一者和合集渴愛言無智者憶念未來生有以一無智當言無智若於聚想而生於智於界想中於入想中於身想中諸所有智中生於智想彼智有為是有為中不名最勝是故此智當言無智言無智者以三種根知彼衆生從合會大地獄中捨身何者三根二睛聚視上瞬轉環若瞋恚時兩目俱赤此是有漏和合等智以如此智應當無智時波斯匿王白佛言世尊復以何智當言有智若於中等智世尊若如是有者寧可復言無有智也佛答王言於有中無智是故於彼無處有智若無有智彼無有有彼無有取彼無無為彼無有為彼無戲論彼即除斷如是非讚歎非不讚歎於彼之中讚歎涅槃於彼時間閻浮提人當作是念若第二四大洲世界之中閻浮提人輩讚歎涅槃作如是言彼即無聲彼即遠離彼無分別彼無和合彼即求念彼即讚歎無惡煩惱不可破壞無想離想彼即無悔彼即為吼於彼第二四大洲世界中所有諸天諸龍夜叉諸有勝者於彼等輩守護攝受此佛菩提於彼處中有一夜叉名曰三摩婆陀那隋云和合説此諸句為生般若故作不顛倒意故作智慧者作彼清淨般若根故作智慧力勝精進故隨所有處正修習已當得正趣當得正意得正堅固當得正念當得大智無畏辨才能破壞他諸論師等令受其語譬如月輪初出之時映蔽一切星宿光明能滅暗障如是一切諸論義師既覆障已威光獨耀於彼之中有此呪句多遲他遮多一憂婆耶陀二黎婆三阿浮薩黎四鼻帝底五雞迷帝六婆步荼七婆那伽八烏瞿盧九鼻步瞿十阿囉他十一阿那囉他吠帝十二阿羅耶十三鼻薩囉十四婆伽那十五阿那呵帝十六波呵帝十七伊舍哆囉十八多都哆囉十九耶多哆囉二十多伊呵二十一伊舍二十二伊苦制主裴反婆二十三多哆二十四多哆制婆二十五娑婆帝婆盧二十六婆帝婆盧二十七説此守護之時有八萬四千諸夜叉衆同時驚懼爾時彼八萬四千諸夜叉衆樂斷殺生於彼等邊付囑言教彼等攝受如是三種護地三品覆護地歡喜信樂勤斷貪愛阿難如是勝法欲隱沒時諸比丘等無有威力若有比丘比丘尼優婆塞優婆夷能讀誦此修多羅者能令彼人乃至壽命具足守護具足守護已常得守護於彼時雖有奪威力諸夜叉等不生信樂於彼等邊不能嬈亂亦復不能奪其威力何以故以彼衆生福德攝受故爾時此修多羅當至彼手以彼衆生自福力故當得守護若於彼時如是法中有生信者彼諸衆生福德不少具足善根於如來所當生實想阿難若於如來邊生實想者彼諸衆生於諸法中能生歡喜信敬之心諸法能生歡喜信敬心者彼即當得隨順於法若能隨順諸法者彼於甚深佛菩提中不生怖畏若於甚深佛菩提中不生怖畏者彼等自不怖畏復能安慰餘怖畏者阿難此諸善法先令是人增長般若增長憶念增長心意增長色增長力增長果報增長名聞增長名稱增長正行增長受記當得長舌損減地獄損減畜生及閻羅王世阿難當得解脫於不間處當成就一切諸善根本阿難然如來所説為多聞故增長智慧者阿難如來依此故説阿難如來作此讚歎之説汝當善受持阿難譬如電後即有浮茶浮茶雷震之聲阿難如是如是如是等諸法轉讚之時當得大智不以為難阿難因此法故現前證見清淨般若清淨意清淨念行得無所畏得清淨法阿難以此法教現前證法及未來世亦復如是阿難此之一智及餘眷屬如來所説不染著無明亦復不為無明所薰遠離修多羅分別之相及嚴熾惡分別之處能令發覺諸外道等自得受持三百偈句既受持已即能巧智解脫之處所有諸患即能捨離若善男子善女人見如是等諸功能已於此佛教應作勤求今少有衆生於此無名法中生樂欲者若有衆生勤修學者當知彼等已於往昔曾事諸佛有一欲行當墮地獄乃至五種欲行當墮地獄何者欲行當墮地獄所謂我想此一欲行當墮地獄有想無想欲行是諸如來作多種説乃至有眼境界所緣諸法以意識觀察彼等一切諸物名字佛悉能知於彼中所有欲行丈夫彼丈夫所有名字於中一切皆入貪欲執著執著己行彼即為因緣欲意中彼閻浮提人於彼丈夫有如是等種種名字福盧沙一鉢盧他二布摩三摩奴沙四因陀羅五首羅六多吒首七婆盧八那都九婆婆十盧鼻摩十一福伽羅十二頻頭十三瞿盧十四囉慰盧十五鼻伽摸十六摩納蒱十七善都十八烏絺十九施吒陀呼二十婆盧慕二十一阿跋羅二十二阿伽婆二十三波若二十四提呵摩二十五陀烏羅二十六婆波婆二十七烏伽二十八頭叉摩二十九形都他三十何娑婆三十一摩呵三十二婆舍三十三提舍三十四形都破三十五阿伽羅三十六薩那破三十七破求沙吒三十八摩留婆帝三十九摩帝婆頭迦四十阿歌摩四十一于頭摩四十二摩頭迦四十三他婆拏伽那四十四伽摩那四十五鼻地婆四十六那婆四十七迦摩陀四十八形盧陀四十九黎婆波五十鼻留波五十一帝形那五十二那羅五十三摩地五十四娑醯帝五十五紇利鉢者五十六著迷帝五十七帝利伽婆多五十八舍陵那五十九那婆者六十俱利舍六十一那形摩六十二帝物利六十三阿訖夜迷六十四婆伽梵六十五那婆羅烏何六十六鼻摩滿陀六十七羅婆六十八婆者六十九鼻羅伽七十提婆羅梵七十一斯摩都七十二婆烏叉七十三婆羅梵七十四娑蘇伽七十五舍叉七十六憂伽多七十七娑利耶破七十八鼻羅七十九烏奴羅八十蘇迷頭八十一俱闍若八十二瞿都摩利婆娑多八十三薩他阿羅婆八十四婆囉鞞帝八十五蘇目多羅八十六帝羅瞿茶八十七鞞羅伏多八十八初婆那八十九雞摩羅九十緊陀羅九十一蘇目陀九十二鉢利耶迦九十三叉滿哆九十四俱偷紇耶九十五鞞留鉢陀九十六鞞留破羅九十七伊岐儞九十八娑木他九十九樹提摩多一百娑那羅一百一娑婆囉一百二尸婆他一百三施梵一百四慰伽梵一百五阿那他夢一百六阿伽拏一百七帝伽羅一百八娑羅破一百九迦摩沙一百十毒怯羅一百十一鼻偷那一百十二薩羅婆一百十三諸如此等是丈夫名如來已知已見已證於欲行中安置如是種種名相名字分別名字執著得見名字滿足一切名字句裏於有分中染著諍競墮愚癡中求索果報此欲行名名字生轉若我若我所若復我中如是空物輕無有物於空自在若以名字著欲行者彼是邪行隨所欲行隨彼邪行彼欲行不斷滅故當墮地獄有二欲行如來所説能作光明作光明法於彼物中隨彼所有生名著於彼中何者是能作光明作光明法如言月名金脂隋云兔亦名星宿主亦名婆奴隋云光者亦名嘔厨波帝隋云星主亦名虛空主亦名善見亦名上行亦名淨主亦名滅暗亦名太白婦亦名宿王亦名不少亦名滿地亦名普鏡亦名團合喜亦名勝方亦名大有眷屬亦名大廣亦名方面亦名等觀亦名宿門亦名圓圍繞亦名明勝亦名慈放功德亦名限量墮勝亦名作虛空亦名直度彼亦名天子此等月天子名字屬閻浮提諸人輩鬱多羅越諸人輩瞿耶尼諸人輩弗婆提諸人輩一切四洲諸人輩平等共名名為事愛亦名心喜普邊行於須彌山王生起光明以是故彼名普行亦名離翳亦名虛空功德亦名端正亦名最極醫師亦名求縛亦名決定物亦名次第流亦名次第增長亦名滿足身果亦名願行亦名端正亦名勝色如是彼中所有光明依彼處已於彼法中思惟念生若欲心若染縛著發覺心生彼作念已彼依倚已由多意喜生彼合煩惱若合煩惱彼即非聖若非聖者不可讚歎若不可讚歎彼非丈夫法若非丈夫法彼是邪見若邪見若邪見者彼當生向惡處若向惡處彼名墮地獄者如是得欲故生欲以有欲故有無明有無明故作惡業作惡業已墮地獄中此第二欲行當墮地獄中彼中何者是第三欲行當墮地獄所有諸法若可讚歎而更毀呰何者謂法是可讚歎所謂戒聚三昧聚智聚解脫聚解脫知見聚四念處四正斷處四神足四禪五根五力七覺分八正道三十七助道法入於彼法中若復謗毀如是法相惡欲行作是語已長老阿難白佛言世尊彼等衆生有何等相忍何境界若如是相甚深微細正和合法當作毀謗作是語已佛告長老阿難作如是言阿難若有衆生於外道言中於摩娑迦利義中專精貪著世間工巧尼乾論義具足愚癡法中為彼義味名字所著身心不解其義雜非法行不正丈夫不能入此甚深微細佛教之中如是業法既不能入以不入故以於如來教當作佛當誹謗彼等為欲慢被所覆雜外道語禮日者禮月者禮風火者當墮地獄亦復不知一切日名彼等以空名聲欲取邪見之念於彼閻浮提中所有諸人稱日名字如來悉知如日名須梨耶隋云日亦名百光亦名毗脂多婆多隋云勝者亦名賢亦名熾盛亦名無上亦名圓形亦名普化亦名令喜亦名勝意亦名不瞋亦名作日分亦名無畏處亦名破暗亦名色主亦名火亦名明亦名除暗亦名淨光音亦名鏡者亦名持地亦名多名亦名不可取亦名讚歎不墮亦名呪力亦名朋友亦名鏡炎亦名滅翳亦名普燈亦名圓意亦名常成熟亦名諸方鏡亦名威主亦名滅塵亦名與熱亦名真成亦名衆生成就業亦名上力亦名光發亦名常境界亦名諸方面亦名回向亦名初出亦名斷顛倒意亦名清淨力亦名陀那婆主隋云施主主此阿修羅名字亦名毗榆遮囉那隋云觀者亦名不定住亦名虎精進亦名普受報亦名精進句亦名不可降亦名圓增長亦名仙人放逸亦名無病亦名不缺最勝意亦名多幢亦名光攝亦名作熱惱亦名諸方顯現亦名嚴熾意亦名脫怨讐亦名住劫回向亦名與眼亦名不失利亦名滿一切望亦名一切堅牢莊嚴主阿難此等日名字國土分中一切諸方所説若有衆生如是名字所演説中若有聞此日名若一切持解知義業不生諍競觀察思惟阿難彼等衆生難得難有何以故彼等名字難可覺悟彼等句行不可教知如來為彼諸衆生等起憐愍故斷疑網故增長智故思惟意行持智慧行辨才根諸力覺分智慧增長故不隨他行增長智故宣説如是諸法相等憐愍心攝受心利益心清淨心故阿難是故此等月日名字不缺不減若干邊際更相繫屬從安慰出生勝印句生阿難如是之處如是清淨若比丘比丘尼優婆塞優婆夷能受如是相者彼即當知日之名字無有邊際及月名字亦無邊際丈夫名字婦女名字彼人當知最勝之處於語業中而得成就於語業中得成就已當至成就勝授記業成就勝授記業已當至成就勝言辭業至言辭業